{% load i18n %}

<form method="post" style="max-width: initial;">
    {% csrf_token %}
    {% include "ingredients/translation-formset.html" %}
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">
            {% trans "Submit" %}
        </button>
    </div>
</form>

{% include "ingredients/markdown-editor.html" %}
<script>
    new TranslationFormset({
        requiredFieldsSelector: '[id*="title"], [id*="content"]'
    });

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea[id*="-content"]').forEach(function (textarea) {
            // Math in news is supported (MathJax typesets it), so the toolbar has buttons for it.
            initMarkdownEditor(textarea, {
                buttons: [
                    {
                        title: '{% trans "Inline math mode" %}',
                        icon: 'fa-square-root-variable',
                        // In Markdown, \( is an escaped bracket, so MathJax needs \\(.
                        wrap: ['\\\\(', '\\\\)'],
                        placeholder: '<mathjax>'
                    },
                    {
                        title: '{% trans "Math mode" %}',
                        icon: 'fa-bars-staggered',
                        wrap: ['$$', '$$'],
                        placeholder: '<mathjax>'
                    }
                ]
            });
        });
    });
</script>
