{% load static %}

<script src="{% static 'markdown_editor.bundle.js' %}"></script>
{% comment %}
    After including markdown add codesnippet to change `<textarea id="editor"></textarea>`
    into a markdown editor (see markdown-editor.js for the options).

    ```
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initMarkdownEditor(document.getElementById('editor'));
    });
    </script>
    ```

    The editor uses `gettext`, which base.html loads at the end of the page,
    so call it once the page has loaded.
{% endcomment %}
